<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 44" fill="none" width="320" height="44">
  <defs>
    <linearGradient id="vpSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E7ED"/>
      <stop offset="70%" stop-color="#C9CFD6"/>
      <stop offset="100%" stop-color="#9BA3AF"/>
    </linearGradient>
    <linearGradient id="vpGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB6D9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9CFD6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Monogram VP Emblem -->
  <g transform="translate(2, 2)">
    <!-- Geometric glass prism outline -->
    <polygon points="20,0 38,10 38,30 20,40 2,30 2,10" stroke="url(#vpSilver)" stroke-width="1.75" fill="rgba(30, 34, 40, 0.6)"/>
    <!-- Glass facet reflection lines -->
    <line x1="20" y1="0" x2="20" y2="40" stroke="url(#vpGlass)" stroke-width="1.25" stroke-dasharray="2 1.5"/>
    <line x1="2" y1="10" x2="38" y2="30" stroke="url(#vpGlass)" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Stylized V and P -->
    <path d="M10,13 L17,27 L20,20 L16,13" fill="url(#vpSilver)"/>
    <path d="M21,13 L27,13 C30,13 32,15 32,18 C32,21 30,23 27,23 L23,23 L23,27 L21,27 Z M23,15.5 L23,20.5 L26.5,20.5 C28,20.5 29.5,19.5 29.5,18 C29.5,16.5 28,15.5 26.5,15.5 Z" fill="url(#vpSilver)"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(52, 2)">
    <text x="0" y="19" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.18em" fill="#EDF1F5">VIDRIERÍA</text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.28em" fill="#C9CFD6">EN PROVIDENCIA</text>
  </g>
</svg>
